# nginx reverse proxy + TLS for S.M.I.P.
#
# Save as /etc/nginx/sites-available/smip, then:
#   sudo ln -s /etc/nginx/sites-available/smip /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d smip.example.com
#
# The app already sends its own security headers (helmet) and rate limits per
# client IP, so all this layer has to do is terminate TLS and forward the real
# address — otherwise every visitor looks like 127.0.0.1 and shares one bucket.

upstream smip_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name smip.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smip.example.com;

    ssl_certificate     /etc/letsencrypt/live/smip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smip.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WebSocket feed
    location /ws {
        proxy_pass http://smip_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Hashed build output can be cached hard; everything else revalidates.
    location /assets/ {
        proxy_pass http://smip_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://smip_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
