# S.M.I.P — single-host deployment for a VPS.
#
#   docker compose up -d --build
#
# Put real values in .env next to this file first (see .env.example). Never
# commit that file: it holds API keys.

services:
  smip:
    build: .
    image: smip:latest
    container_name: smip
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Behind nginx/Caddy, keep trust proxy on so rate limits see real client IPs.
      TRUST_PROXY: "1"
    ports:
      # Bind to loopback only: the reverse proxy terminates TLS and is the only
      # thing that should reach the app directly.
      - "127.0.0.1:3000:3000"
    volumes:
      - smip-data:/app/src/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  smip-data:
